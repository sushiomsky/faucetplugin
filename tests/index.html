<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FaucetPick — Test Runner</title>
  <style>
    body { font-family: monospace; background: #111; color: #eee; padding: 20px; }
    h1 { color: #7eb8ff; }
    .pass { color: #4ade80; }
    .fail { color: #f87171; }
    .suite { color: #fbbf24; margin-top: 16px; font-size: 14px; font-weight: bold; }
    #summary { margin-top: 24px; font-size: 16px; border-top: 1px solid #333; padding-top: 12px; }
  </style>
</head>
<body>
  <h1>🚰 FaucetPick — Test Runner</h1>
  <div id="output"></div>
  <div id="summary"></div>

  <!--
    Script load order MUST match content_scripts order in manifest.json.
    Chrome API is stubbed in tests/stubs/chrome.js (loaded first by each test file).
    Tests that require DOM or real Chrome API are skipped here with a NOTE.
  -->
  <script src="../constants.js"></script>
  <!-- crypto-utils.js requires chrome.storage.local — loaded in test file with stub -->
  <!-- selectors.js requires window.location — not testable here without stub -->
  <script src="../utils.js"></script>

  <!-- Test suites -->
  <script src="stubs/chrome.js"></script>
  <script src="config.test.js"></script>
  <script src="constants.test.js"></script>
  <script src="utils.test.js"></script>

  <script>
    // ── Test harness ─────────────────────────────────────────────────────────
    window.__tests = window.__tests || [];
    window.__results = { pass: 0, fail: 0, skip: 0 };

    function renderResults() {
      const out = document.getElementById('output');
      const sum = document.getElementById('summary');
      out.innerHTML = window.__tests.map(t => {
        if (t.skipped) {
          return `<div class="skip">⏭ SKIP │ ${t.suite} │ ${t.name} <span style="color:#888">(${t.reason})</span></div>`;
        }
        const icon = t.passed ? '✓' : '✗';
        const cls  = t.passed ? 'pass' : 'fail';
        const msg  = t.passed ? 'PASS' : `FAIL — ${t.error}`;
        return `<div class="${cls}">${icon} ${msg} │ ${t.suite} │ ${t.name}</div>`;
      }).join('\n');
      const r = window.__results;
      sum.innerHTML = `<strong>Results: <span class="pass">${r.pass} passed</span>, <span class="fail">${r.fail} failed</span>, ${r.skip} skipped</strong>`;
    }

    document.addEventListener('DOMContentLoaded', async () => {
      await runAllTests();
      renderResults();
    });
  </script>
</body>
</html>
