<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faucet Pro | Setup Wizard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #05050a;
      --panel: rgba(20, 20, 35, 0.6);
      --accent: #f0b90b;
      --accent-glow: rgba(240, 185, 11, 0.3);
      --text: #ffffff;
      --text-dim: #9aa0b8;
      --glass: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.08);
      --status-ok: #00ff88;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(240, 185, 11, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(240, 185, 11, 0.03) 0%, transparent 40%);
    }

    .wizard-container {
      width: 100%;
      max-width: 480px;
      padding: 40px;
      background: var(--panel);
      backdrop-filter: blur(40px);
      border: 1px solid var(--glass-border);
      border-radius: 40px;
      box-shadow: 0 40px 100px -20px rgba(0, 0, 0, 0.8);
      position: relative;
      text-align: center;
    }

    .wizard-steps {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 24px 0;
    }
    .wizard-dot {
      width: 10px;
      height: 10px;
      background: #333;
      border-radius: 50%;
      transition: all 0.3s;
    }
    .wizard-dot.active { background: #fff; box-shadow: 0 0 15px rgba(255,255,255,0.4); transform: scale(1.2); }
    .wizard-dot.completed { background: var(--accent); }

    .step-content { display: none; height: 320px; flex-direction: column; }
    .step-content.active { display: flex; animation: slideUp 0.4s ease-out; }

    @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

    .hero-icon { font-size: 64px; margin-bottom: 20px; }
    h1 { font-size: 32px; font-weight: 700; margin-bottom: 8px; }
    .sub { color: var(--text-dim); font-size: 16px; margin-bottom: 30px; }

    .selection-panel {
      background: rgba(0,0,0,0.2);
      border-radius: 24px;
      padding: 15px;
      margin-bottom: 30px;
      flex: 1;
      overflow-y: auto;
      border: 1px solid var(--glass-border);
    }
    .selection-panel::-webkit-scrollbar { width: 4px; }
    .selection-panel::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 10px; }

    .site-toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      margin-bottom: 8px;
    }
    .site-ico { width: 24px; font-weight: 700; color: var(--accent); }
    .site-lbl { font-size: 14px; font-weight: 600; flex: 1; text-align: left; margin-left: 10px; }

    .wizard-footer { display: flex; align-items: center; justify-content: center; gap: 15px; }
    
    .btn-p {
      flex: 1; background: linear-gradient(90deg, #f0b90b, #ffe580); color: #000;
      padding: 16px; border-radius: 50px; font-family: inherit; font-size: 15px; font-weight: 800;
      border: none; cursor: pointer; box-shadow: 0 10px 30px var(--accent-glow);
      transition: 0.3s; text-transform: uppercase; letter-spacing: 1px;
    }
    .btn-p:hover { transform: translateY(-3px); filter: brightness(1.1); }
    .btn-p:disabled { opacity: 0.3; transform: none; box-shadow: none; }

    .input-field {
      width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border);
      border-radius: 16px; padding: 14px; color: #fff; font-family: inherit; font-size: 14px;
      margin-bottom: 15px; text-align: left;
    }

    .switch { position: relative; display: inline-block; width: 36px; height: 20px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #333; transition: .4s; border-radius: 20px; }
    .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 2px; bottom: 2px; background-color: white; transition: .4s; border-radius: 50%; }
    input:checked + .slider { background-color: var(--status-ok); }
    input:checked + .slider:before { transform: translateX(16px); }
  </style>
</head>
<body>

  <div class="wizard-container">
    <div class="hero-icon">💸</div>
    <h1>Faucet Pro</h1>
    <p class="sub">Quick Setup Wizard</p>

    <div class="wizard-steps">
      <div class="wizard-dot active"></div>
      <div class="wizard-dot"></div>
      <div class="wizard-dot"></div>
      <div class="wizard-dot"></div>
    </div>

    <!-- STEP 1: WELCOME -->
    <section class="step-content active" id="step1">
      <div style="flex:1; display:flex; flex-direction:column; justify-content:center;">
        <h2 style="margin-bottom:12px;">Get Started</h2>
        <p style="color:var(--text-dim); line-height:1.6;">Automate your favorite faucets in just a few clicks. Faucet Pro handles the claims while you relax.</p>
      </div>
      <div class="wizard-footer">
        <button class="btn-p" id="welcomeBtn">Next Step ➔</button>
      </div>
    </section>

    <!-- STEP 2: CHOOSE SITES -->
    <section class="step-content" id="step2">
      <h2 style="margin-bottom:12px; font-size:18px;">Pick Your Faucets</h2>
      <div class="selection-panel" id="siteGrid">
        <!-- Site toggles injected here -->
      </div>
      <div class="wizard-footer">
        <button class="btn-p" id="siteNextBtn">Next Step ➔</button>
      </div>
    </section>

    <!-- STEP 3: WALLETS -->
    <section class="step-content" id="step3">
      <h2 style="margin-bottom:12px; font-size:18px;">Payout Wallets</h2>
      <div class="selection-panel" id="walletList">
        <!-- Wallet inputs injected here -->
      </div>
      <div class="wizard-footer">
        <button class="btn-p step-next-btn">Finish Setup ➔</button>
      </div>
    </section>

    <!-- STEP 4: FINISH -->
    <section class="step-content" id="step4">
      <div style="flex:1; display:flex; flex-direction:column; justify-content:center;">
        <div class="hero-icon" style="font-size:64px;">✨</div>
        <h2 style="margin-bottom:10px;">All Set!</h2>
        <p style="color:var(--text-dim); line-height:1.6;">Everything is configured. The bot will now start monitoring your selected sites.</p>
      </div>
      <div class="wizard-footer">
        <button class="btn-p" id="launchBtn">Go to Dashboard ➔</button>
      </div>
    </section>
  </div>

  <script src="constants.js"></script>
  <script src="setup.js"></script>
</body>
</html>
