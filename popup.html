<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Faucet Auto-Claimer Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a12;
      --panel: rgba(25, 25, 45, 0.7);
      --accent: #f0b90b;
      --accent-glow: rgba(240, 185, 11, 0.3);
      --text: #ffffff;
      --text-dim: #9aa0b8;
      --status-ok: #00ff88;
      --status-err: #ff4d4d;
      --glass: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.1);
    }

    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: 'Outfit', sans-serif;
      width: 380px;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(240, 185, 11, 0.05) 0%, transparent 20%),
        radial-gradient(circle at 90% 80%, rgba(0, 255, 136, 0.05) 0%, transparent 20%);
    }

    /* ── Header ── */
    header {
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(10, 10, 18, 0.8);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--glass-border);
    }
    header h1 { 
      margin: 0; 
      font-size: 18px; 
      font-weight: 700;
      background: linear-gradient(90deg, #f0b90b, #ffe580);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }
    .header-status {
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
    }

    /* ── Tabs ── */
    .tabs {
      display: flex;
      gap: 10px;
      padding: 10px 20px;
      background: rgba(15, 15, 25, 0.5);
    }
    .tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      color: var(--text-dim);
      border-radius: 12px;
      transition: all 0.3s ease;
      background: transparent;
    }
    .tab.active { 
      color: var(--text); 
      background: var(--glass);
      border: 1px solid var(--glass-border);
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    .tab:hover:not(.active) { color: #fff; background: rgba(255,255,255,0.03); }

    /* ── Main content ── */
    .content-area { padding: 20px; }
    .panel { display: none; }
    .panel.active { display: block; animation: fadeIn 0.4s ease-out; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ── Dashboard Status Card ── */
    .status-card {
      background: linear-gradient(135deg, rgba(30, 30, 50, 0.8), rgba(20, 20, 35, 0.8));
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid var(--glass-border);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .status-indicator {
      width: 12px; height: 12px;
      border-radius: 50%;
      position: relative;
    }
    .status-indicator::after {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: inherit;
      opacity: 0.3;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.4; }
      100% { transform: scale(2.5); opacity: 0; }
    }
    .status-info h2 { margin: 0; font-size: 15px; font-weight: 600; }
    .status-info p { margin: 5px 0 0; font-size: 12px; color: var(--text-dim); }

    .site-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }
    .stat-item {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      padding: 12px;
      border-radius: 15px;
      text-align: center;
    }
    .stat-label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
    .stat-value { font-size: 14px; font-weight: 700; margin-top: 4px; }

    /* ── Site List ── */
    .site-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
    .site-card {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 15px;
      padding: 12px 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: border-color 0.3s;
    }
    .site-card:hover { border-color: rgba(240, 185, 11, 0.4); }
    .site-info { display: flex; align-items: center; gap: 12px; }
    .site-icon { width: 32px; height: 32px; border-radius: 10px; background: #2a2a40; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; color: #f0b90b; }
    .site-meta h3 { margin: 0; font-size: 13px; font-weight: 600; }
    .site-meta p { margin: 2px 0 0; font-size: 11px; color: var(--text-dim); }
    .site-status-tag { font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 8px; }

    /* ── Controls ── */
    .controls { display: flex; gap: 10px; }
    .btn {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 15px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.3s ease;
    }
    .btn-primary { background: var(--accent); color: #000; box-shadow: 0 4px 15px var(--accent-glow); }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px var(--accent-glow); }
    .btn-danger { background: rgba(255, 77, 77, 0.1); color: #ff4d4d; border: 1px solid rgba(255, 77, 77, 0.2); }
    .btn-danger:hover { background: rgba(255, 77, 77, 0.2); }
    .btn:disabled { opacity: 0.5; transform: none; cursor: not-allowed; }

    /* ── Config Panel ── */
    .config-group { margin-bottom: 24px; }
    .group-title { font-size: 12px; font-weight: 700; color: var(--accent); text-transform: uppercase; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
    .config-card { background: var(--glass); border: 1px solid var(--glass-border); border-radius: 20px; padding: 20px; }
    
    .input-field { margin-bottom: 15px; }
    .input-field:last-child { margin-bottom: 0; }
    .input-label { display: block; font-size: 11px; color: var(--text-dim); font-weight: 600; margin-bottom: 8px; }
    .input-container { position: relative; }
    input[type="text"], input[type="password"], input[type="number"], select {
      width: 100%;
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 12px;
      color: #fff;
      font-family: inherit;
      font-size: 13px;
      transition: border-color 0.3s;
    }
    input:focus { border-color: var(--accent); outline: none; }
    
    .input-suffix { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-size: 11px; color: var(--text-dim); font-weight: 600; pointer-events: none; }

    .usd-rate { font-size: 10px; color: var(--status-ok); font-weight: 600; display: block; margin-top: 4px; }
    .min-label { font-size: 10px; color: var(--accent); font-weight: 600; display: block; margin-top: 4px; }

    /* Site Selection Grid */
    .site-selector-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .site-option {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 15px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      position: relative;
      transition: all 0.3s;
    }
    .site-option.selected { border-color: var(--accent); background: rgba(240, 185, 11, 0.05); }
    .site-option input { position: absolute; top: 12px; left: 12px; border-radius: 5px; accent-color: var(--accent); }
    .site-option-icon { font-size: 20px; }
    .site-option-name { font-size: 12px; font-weight: 600; }

    /* Range Input Styles */
    .range-inputs { display: flex; gap: 10px; }
    .range-inputs > div { flex: 1; }

    /* ── Logs ── */
    .log-container { display: flex; flex-direction: column; gap: 8px; }
    .log-item { background: var(--glass); border-left: 3px solid var(--glass-border); border-radius: 0 10px 10px 0; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; }
    .log-item.ok { border-left-color: var(--status-ok); }
    .log-item.err { border-left-color: var(--status-err); }
    .log-main { display: flex; flex-direction: column; gap: 2px; }
    .log-site { font-size: 12px; font-weight: 700; }
    .log-action { font-size: 10px; color: var(--text-dim); }
    .log-info { text-align: right; }
    .log-time { font-size: 10px; color: var(--text-dim); }
    .log-balance { font-size: 11px; font-weight: 700; color: var(--accent); }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 10px; }
  </style>
</head>
<body>

<header>
  <h1>FAUCET PRO</h1>
  <div class="header-status" id="headerStatus">Loading…</div>
</header>

<nav class="tabs">
  <div class="tab active" data-tab="status">Overview</div>
  <div class="tab" data-tab="config">Settings</div>
  <div class="tab" data-tab="log">History</div>
</nav>

<main class="content-area">
  <!-- ── STATUS PANEL ── -->
  <section class="panel active" id="tab-status">
    <div class="status-card">
      <div class="status-indicator grey" id="statusDot"></div>
      <div class="status-info">
        <h2 id="statusTitle">Idle</h2>
        <p id="statusDesc">Scheduler is ready</p>
      </div>
    </div>

    <div class="site-stats">
      <div class="stat-item">
        <div class="stat-label">Active Sites</div>
        <div class="stat-value" id="activeCount">0</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Total Gained</div>
        <div class="stat-value" id="totalValue">$0.00</div>
      </div>
    </div>

    <div class="site-list" id="siteRows">
      <!-- Site cards injected here -->
    </div>

    <div class="controls">
      <button class="btn btn-primary" id="runBtn">▶ Start Claim Process</button>
      <button class="btn btn-danger" id="stopBtn" style="display:none">■ Stop Task</button>
    </div>
  </section>

  <!-- ── CONFIG PANEL ── -->
  <section class="panel" id="tab-config">
    <div class="config-group">
      <div class="group-title"><span>⚙️</span> Global Toggle</div>
      <div class="config-card" style="display:flex; justify-content:space-between; align-items:center;">
        <span style="font-size:13px; font-weight:600;">Auto-Claim Scheduler</span>
        <input type="checkbox" id="cfgEnabled" style="width:20px; height:20px; accent-color:var(--accent);">
      </div>
    </div>

    <div class="config-group">
      <div class="group-title"><span>🌐</span> Select Faucets</div>
      <div class="site-selector-grid" id="siteSelectorGrid">
        <!-- Site options injected here -->
      </div>
    </div>

    <div class="config-group" id="faucetConfigSection" style="display:none">
      <div class="group-title"><span>💎</span> <span id="selectedSiteLabel">Site Settings</span></div>
      <div class="config-card" id="siteConfigCard">
        <!-- Config inputs injected here -->
      </div>
    </div>

    <button class="btn btn-primary" id="saveBtn" style="width:100%; margin-top:20px;">💾 Save Configuration</button>
    <div id="saveMsg" style="text-align:center; font-size:12px; margin-top:10px; height:15px;"></div>

    <div style="display:flex; gap:10px; margin-top:20px; opacity:0.6;">
      <button class="btn btn-danger" id="resetBtn" style="font-size:11px; padding:10px;">Reset Factory</button>
      <button class="btn btn-danger" id="exportBtn" style="font-size:11px; padding:10px;">Export JSON</button>
    </div>
  </section>

  <!-- ── LOG PANEL ── -->
  <section class="panel" id="tab-log">
    <div class="log-container" id="logList">
      <div style="text-align:center; color:var(--text-dim); font-size:12px; margin-top:40px;">No events recorded</div>
    </div>
  </section>
</main>

<script src="constants.js"></script>
<script src="popup.js"></script>
</body>
</html>
