<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Faucet Auto-Claimer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: "Segoe UI", sans-serif;
      width: 340px;
      margin: 0;
      background: #12121e;
      color: #ddd;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1c1c2e;
      padding: 12px 14px;
      border-bottom: 1px solid #2a2a45;
    }
    header h1 { margin: 0; font-size: 14px; color: #e0b03f; letter-spacing: .5px; }
    header span { font-size: 11px; color: #666; }

    /* ── Tabs ── */
    .tabs {
      display: flex;
      background: #1c1c2e;
      border-bottom: 1px solid #2a2a45;
    }
    .tab {
      flex: 1;
      padding: 8px 4px;
      text-align: center;
      font-size: 11px;
      cursor: pointer;
      color: #888;
      border-bottom: 2px solid transparent;
      transition: color .2s, border-color .2s;
    }
    .tab.active { color: #e0b03f; border-bottom-color: #e0b03f; }
    .tab:hover:not(.active) { color: #bbb; }

    /* ── Panels ── */
    .panel { display: none; padding: 14px; }
    .panel.active { display: block; }

    /* ── Status panel ── */
    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 6px;
      background: #1c1c2e;
      margin-bottom: 12px;
    }
    .dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot.green  { background: #4caf50; box-shadow: 0 0 6px #4caf5088; }
    .dot.orange { background: #e0b03f; box-shadow: 0 0 6px #e0b03f88; }
    .dot.red    { background: #e05050; box-shadow: 0 0 6px #e0505088; }
    .dot.grey   { background: #555; }
    #statusText { font-size: 12px; }

    .next-run {
      font-size: 11px;
      color: #888;
      margin-bottom: 12px;
      text-align: center;
    }

    .site-rows { margin-bottom: 12px; }
    .site-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 10px;
      background: #1c1c2e;
      border-radius: 5px;
      margin-bottom: 4px;
      font-size: 12px;
    }
    .site-name { color: #ccc; }
    .site-status { font-size: 11px; }
    .site-status.ok    { color: #4caf50; }
    .site-status.error { color: #e05050; }
    .site-status.idle  { color: #555; }

    .log-title { font-size: 11px; color: #666; margin-bottom: 6px; }
    .log-list {
      max-height: 110px;
      overflow-y: auto;
      font-size: 10px;
      color: #666;
    }
    .log-entry { padding: 2px 0; border-bottom: 1px solid #1e1e30; }
    .log-entry .ok    { color: #4caf50; }
    .log-entry .error { color: #e05050; }

    /* ── Buttons ── */
    .btn {
      width: 100%;
      padding: 9px;
      border: none;
      border-radius: 5px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s;
      margin-bottom: 6px;
    }
    .btn:disabled { opacity: .45; cursor: default; }
    .btn-primary  { background: #e0b03f; color: #12121e; }
    .btn-primary:hover:not(:disabled) { background: #c99a2e; }
    .btn-danger   { background: #c0392b; color: #fff; }
    .btn-danger:hover:not(:disabled)  { background: #a93226; }

    /* ── Config panel ── */
    .field { margin-bottom: 14px; }
    label { display: block; font-size: 11px; color: #888; margin-bottom: 5px; }

    /* Toggle switch */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: #1c1c2e;
      border-radius: 6px;
      margin-bottom: 14px;
    }
    .toggle-label { font-size: 13px; }
    .toggle {
      position: relative;
      width: 42px; height: 22px;
    }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      inset: 0;
      background: #333;
      border-radius: 22px;
      cursor: pointer;
      transition: background .2s;
    }
    .slider::before {
      content: "";
      position: absolute;
      width: 16px; height: 16px;
      left: 3px; top: 3px;
      background: #fff;
      border-radius: 50%;
      transition: transform .2s;
    }
    .toggle input:checked + .slider { background: #e0b03f; }
    .toggle input:checked + .slider::before { transform: translateX(20px); }

    input[type="number"], input[type="text"], select {
      width: 100%;
      padding: 7px 10px;
      background: #1c1c2e;
      border: 1px solid #2a2a45;
      border-radius: 5px;
      color: #ddd;
      font-size: 13px;
    }
    input[type="number"]:focus, input[type="text"]:focus, select:focus {
      outline: none;
      border-color: #e0b03f88;
    }

    .faucet-config-block {
      background: #1c1c2e;
      border-radius: 6px;
      padding: 8px 10px;
      margin-bottom: 8px;
    }
    .clean-config {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .cfg-card {
      background: #181827;
      border: 1px solid #2a2a45;
      border-radius: 8px;
      padding: 10px;
    }
    .cfg-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .cfg-card-title {
      font-size: 12px;
      font-weight: 700;
      color: #e0b03f;
      letter-spacing: .2px;
    }
    .cfg-subtitle {
      margin-top: 8px;
      margin-bottom: 6px;
      font-size: 11px;
      color: #9aa0b8;
      font-weight: 600;
    }
    .cfg-note {
      margin-bottom: 8px;
      padding: 6px 8px;
      border-radius: 6px;
      background: #12121e;
      border: 1px solid #2a2a45;
      color: #a8afc7;
      font-size: 10px;
      line-height: 1.35;
      cursor: help;
    }
    .cfg-grid {
      display: grid;
      gap: 8px;
    }
    .cfg-grid.two-col { grid-template-columns: 1fr; }
    .cfg-grid.three-col { grid-template-columns: 1fr; }
    .cfg-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .cfg-row.compact {
      display: grid;
      grid-template-columns: 1fr 110px;
      align-items: end;
      gap: 8px;
    }
    .cfg-row label {
      font-size: 10px;
      color: #9aa0b8;
      margin: 0;
    }
    .tip-label {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: help;
    }
    .tip-icon {
      color: #4fc3f7;
      font-size: 10px;
      line-height: 1;
    }
    @media (min-width: 320px) {
      .cfg-grid.two-col { grid-template-columns: 1fr 1fr; }
    }
    @media (min-width: 480px) {
      .cfg-grid.three-col { grid-template-columns: 1fr 1fr; }
    }
    .faucet-config-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 5px;
    }
    .faucet-config-row input[type="text"],
    .faucet-config-row input[type="password"] {
      flex: 1;
      padding: 4px 8px;
      font-size: 11px;
      border: 1px solid #2a2a45;
    }
    .faucet-creds {
      display: flex;
      gap: 6px;
      margin-top: 2px;
    }
    .faucet-creds input {
      flex: 1;
      padding: 4px 8px;
      font-size: 11px;
      background: #12121e;
      border: 1px solid #2a2a45;
      border-radius: 4px;
      color: #ddd;
    }
    .faucet-creds input:focus { outline: none; border-color: #e0b03f88; }
    .cred-label { font-size: 10px; color: #555; margin-bottom: 3px; }
    .faucet-check { accent-color: #e0b03f; width: 14px; height: 14px; cursor: pointer; }
    
    /* Site selection */
    .faucet-site-selector {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 14px;
    }
    .site-radio-option {
      position: relative;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      background: #1c1c2e;
      border: 2px solid #2a2a45;
      border-radius: 6px;
      cursor: pointer;
      transition: all .2s;
    }
    .site-radio-option:hover {
      border-color: #e0b03f55;
    }
    .site-radio-option input[type="checkbox"] {
      accent-color: #e0b03f;
      width: 14px;
      height: 14px;
      cursor: pointer;
      margin: 0;
    }
    .site-radio-option input[type="checkbox"]:checked + label {
      color: #e0b03f;
      font-weight: 600;
    }
    .site-radio-option label {
      font-size: 12px;
      cursor: pointer;
      margin: 0;
      flex: 1;
    }
    .site-radio-option.checked {
      border-color: #e0b03f;
      background: rgba(224, 176, 63, 0.08);
    }
    .site-radio-option.selected {
      border-color: #4fc3f7;
      box-shadow: 0 0 0 1px #4fc3f744 inset;
    }

    .save-row { display: flex; gap: 6px; margin-top: 4px; }
    .save-row .btn { margin-bottom: 0; }
    #saveMsg { font-size: 11px; color: #4caf50; text-align: center; margin-top: 6px; min-height: 14px; }
    .wd-section {
      margin-top: 6px;
      border-top: 1px solid #2a2a45;
      padding-top: 6px;
    }
    .wd-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 5px;
    }
    .wd-header .cred-label { margin: 0; }
    .wd-fields {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .wd-fields input {
      width: 100%;
      padding: 4px 8px;
      font-size: 11px;
      background: #12121e;
      border: 1px solid #2a2a45;
      border-radius: 4px;
      color: #ddd;
    }
    .wd-fields input:focus { outline: none; border-color: #e0b03f88; }
    .wd-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .wd-row input[type="number"] {
      width: 90px;
      flex-shrink: 0;
      padding: 4px 8px;
      font-size: 11px;
      background: #12121e;
      border: 1px solid #2a2a45;
      border-radius: 4px;
      color: #ddd;
    }
    .wd-row input[type="number"]:focus { outline: none; border-color: #e0b03f88; }
    .wd-row span { font-size: 10px; color: #555; flex-shrink: 0; }
    .log-entry .wd-ok    { color: #4fc3f7; }
    .log-entry .wd-error { color: #ff8a65; }
  </style>
</head>
<body>

<header>
  <h1>🪙 Faucet Auto-Claimer</h1>
  <span id="headerState">–</span>
</header>

<nav class="tabs">
  <div class="tab active" data-tab="status">Status</div>
  <div class="tab" data-tab="config">Configure</div>
  <div class="tab" data-tab="log">Log</div>
</nav>

<!-- ── STATUS TAB ── -->
<section class="panel active" id="tab-status">
  <div class="status-badge">
    <div class="dot grey" id="statusDot"></div>
    <div id="statusText">Loading…</div>
  </div>
  <div class="next-run" id="nextRun"></div>

  <div class="site-rows" id="siteRows"></div>

  <button class="btn btn-primary" id="runBtn">▶ Run Now</button>
  <button class="btn btn-danger"  id="stopBtn" style="display:none">■ Stop Run</button>
</section>

<!-- ── CONFIG TAB ── -->
<section class="panel" id="tab-config">
  <div class="toggle-row">
    <span class="toggle-label">Enable scheduler</span>
    <label class="toggle">
      <input type="checkbox" id="cfgEnabled" />
      <span class="slider"></span>
    </label>
  </div>

  <div class="field">
    <label>Select active sites (claimed sequentially). Click a site card to edit its settings.</label>
    <div id="faucetSiteSelector" class="faucet-site-selector"></div>
  </div>

  <div class="field" id="faucetConfigSection" style="display:none">
    <label>Configuration for selected site</label>
    <div id="faucetConfigBlock"></div>
  </div>

  <div class="save-row">
    <button class="btn btn-primary" id="saveBtn">💾 Save Settings</button>
  </div>
  <div id="saveMsg"></div>

  <div class="save-row" style="margin-top:14px;border-top:1px solid #2a2a45;padding-top:14px">
    <button class="btn btn-primary" id="exportBtn">📥 Export</button>
    <button class="btn btn-primary" id="importBtn">📤 Import</button>
    <input type="file" id="importFile" accept=".json" style="display:none" />
  </div>
  <div id="importMsg"></div>
</section>

<!-- ── LOG TAB ── -->
<section class="panel" id="tab-log">
  <div class="log-title">Last 20 claim attempts</div>
  <div class="log-list" id="logList">
    <div class="log-entry" style="color:#555;font-style:italic">No entries yet.</div>
  </div>
</section>

<script src="constants.js"></script>
<script src="popup.js"></script>
</body>
</html>
